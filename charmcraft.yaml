# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: loki-vm
title: Loki VM Operator
summary: Loki VM Operator for log aggregation and storage
description: |
  This charm provides a machine class charm for Grafana Loki
  installing it from the grafana labs upstream repository.

# Documentation:
# https://documentation.ubuntu.com/charmcraft/stable/howto/build-guides/select-platforms/
base: ubuntu@24.04
platforms:
  amd64:

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv

storage:
  loki-persisted:
    type: filesystem
    description: Mount point in which Loki will store all persisted data such as index and chunks.

provides:
  loki_push_api:
    interface: loki_push_api
    description: Integration to receive logs from other charms.
  grafana-source:
    interface: grafana_datasource
    optional: true
    description: |
      Configures Grafana to be able to use this Loki instance as a datasource.
  send-datasource:
    interface: grafana_datasource_exchange
    optional: true
    description: |
      Integration to share this charm's Grafana datasource data with other COS components.

requires:
  ingress:
    interface: ingress_per_unit
    optional: true
    limit: 1
    description: |
      Ingress integration for Loki, so that cross-model workloads can send their logs
      to Loki through the ingress.
      Loki uses "ingress per unit" (not per app), so each unit gets ingressed separately.
  s3:
    interface: s3
    optional: true
    limit: 1
    description: |
      Consume S3 credentials and endpoint information from an S3 provider charm for
      Loki TSDB object storage.

peers:
  replicas:
    interface: loki_replica

# (Optional) Configuration options for the charm
# This config section defines charm config options, and populates the Configure
# tab on Charmhub.
# More information on this section at:
# https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/#config
# General configuration documentation:
# https://documentation.ubuntu.com/juju/3.6/reference/configuration/#application-configuration
config:
  options:
    ingestion-rate-mb:
      description: |
        Per-user ingestion rate limit (MB/s).
        This matches Loki's `ingestion_rate_mb` (float in Loki, int here).
        Ref: https://grafana.com/docs/loki/latest/configure/#limits_config
      type: int
      default: 4
    ingestion-burst-size-mb:
      description: |
        Per-user ingestion burst size (MB).
        This matches Loki's `ingestion_burst_size_mb` (float in Loki, int here).
        Ref: https://grafana.com/docs/loki/latest/configure/#limits_config
      type: int
      default: 15
    retention-period:
      description: |
        Global retention period in days. Defaults to 14 days as a guard against
        unbounded storage growth; 0 disables retention.
        Ref: https://grafana.com/docs/loki/latest/operations/storage/retention/
      type: int
      default: 14
    reporting-enabled:
      description: |
        Enable anonymous usage reporting to stats.grafana.org.
        Ref: https://grafana.com/docs/loki/latest/configure/#analytics
      type: boolean
      default: true
    external-url:
      description: |
        External URL used when advertising Loki endpoints over relations.
        Leave empty to use the unit address.
      type: string
      default: ""
    config-override:
      description: |
        Full Loki configuration file as a string. When set, this overrides the
        generated configuration entirely. Set to empty to revert to generated config.
      type: string
      default: ""
